<!DOCTYPE html>

<html lang="en"><head>
<meta charset="UTF-8">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LinkTrack | Authentication</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<!-- BEGIN: External Dependencies -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- END: External Dependencies -->
<!-- BEGIN: Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            dark: {
              background: '#020617', // Deep navy
              card: '#161d2f', // Charcoal/Dark blue
              input: '#1f2937',
              border: '#374151'
            }
          }
        }
      }
    }
  </script>
<!-- END: Custom Configuration -->
<!-- BEGIN: Layout Styles -->
<style data-purpose="custom-animations">
    .auth-card {
      transition: all 0.3s ease-in-out;
    }
    .hidden {
      display: none;
    }
    body {
      background-color: #020617;
    }
  </style>
<!-- END: Layout Styles -->
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans text-slate-200">
<!-- BEGIN: Auth Container -->
<main class="w-full max-w-md" data-purpose="auth-container">
<!-- Branding -->
<div class="text-center mb-8" data-purpose="logo-section">
<div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-lg mb-4 shadow-lg shadow-blue-900/20">
<svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-3xl font-bold text-white">LinkTrack</h1>
<p class="text-slate-400 mt-2">Manage and monitor your links with precision.</p>
</div>
<!-- Auth Card -->
<section class="bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 auth-card" data-purpose="auth-form-card">
<!-- BEGIN: Tab Toggle -->
<div class="flex bg-slate-950 p-1 rounded-xl mb-8" data-purpose="form-toggle">
<button class="flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-blue-500 shadow-sm transition-all" id="tab-login" onclick="toggleAuth('login')">
          Login
        </button>
<button class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-blue-500 transition-all" id="tab-signup" onclick="toggleAuth('signup')">
          Sign Up
        </button>
</div>
<!-- END: Tab Toggle -->
<!-- BEGIN: Login Form -->
<form class="space-y-5" data-purpose="login-form" id="form-login">
<div class="space-y-1">
<label class="text-sm font-medium text-slate-300" for="login-email">Email Address</label>
<input class="w-full px-4 py-3 rounded-lg bg-slate-800 border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" id="login-email" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="text-sm font-medium text-slate-300" for="login-password">Password</label>
<a class="text-xs font-semibold text-blue-500 hover:text-blue-400" href="#">Forgot password?</a>
</div>
<input class="w-full px-4 py-3 rounded-lg bg-slate-800 border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" id="login-password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-blue-900/30" type="submit">
          Sign In
        </button>
<!-- Social Login Separator -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-700"></span></div>
<div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900 px-2 text-slate-500 font-medium">Or continue with</span></div>
</div>
<button class="w-full border border-slate-700 text-slate-300 font-semibold py-3 px-4 rounded-lg hover:bg-slate-800 transition-colors flex items-center justify-center gap-2" type="button" onclick="window.location.href='dashboard.html'">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="currentColor"></path>
</svg>
          Google
        </button>
</form>
<!-- END: Login Form -->
<!-- BEGIN: Signup Form -->
<form class="space-y-5 hidden" data-purpose="signup-form" id="form-signup">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-sm font-medium text-slate-300" for="signup-first">First Name</label>
<input class="w-full px-4 py-3 rounded-lg bg-slate-800 border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" id="signup-first" placeholder="Jane" type="text"/>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-slate-300" for="signup-last">Last Name</label>
<input class="w-full px-4 py-3 rounded-lg bg-slate-800 border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" id="signup-last" placeholder="Doe" type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-slate-300" for="signup-email">Email Address</label>
<input class="w-full px-4 py-3 rounded-lg bg-slate-800 border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" id="signup-email" placeholder="jane@company.com" type="email"/>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-slate-300" for="signup-password">Create Password</label>
<input class="w-full px-4 py-3 rounded-lg bg-slate-800 border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" id="signup-password" placeholder="••••••••" type="password"/>
<p class="text-xs text-slate-500 mt-1">Must be at least 8 characters long.</p>
</div>
<div class="flex items-start gap-2">
<input class="mt-1 rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-blue-500 focus:ring-offset-dark-card" id="terms" type="checkbox"/>
<label class="text-xs text-slate-400" for="terms">I agree to the <a class="text-blue-500 underline" href="#">Terms of Service</a> and <a class="text-blue-500 underline" href="#">Privacy Policy</a>.</label>
</div>
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-blue-900/30" type="submit">
          Create Account
        </button>
</form>
<!-- END: Signup Form -->
</section>
<!-- Footer Links -->
<footer class="mt-8 text-center" data-purpose="auth-footer">
<p class="text-sm text-slate-500">
        © 2023 LinkTrack. All rights reserved.
      </p>
<div class="mt-2 space-x-4">
<a class="text-xs text-slate-400 hover:text-blue-500 transition-colors" href="#">Support</a>
<a class="text-xs text-slate-400 hover:text-blue-500 transition-colors" href="#">Privacy</a>
<a class="text-xs text-slate-400 hover:text-blue-500 transition-colors" href="#">Documentation</a>
</div>
</footer>
</main>
<!-- END: Auth Container -->
<!-- BEGIN: Interaction Logic -->
<script data-purpose="auth-logic">
    function toggleAuth(view) {
      const loginForm = document.getElementById('form-login');
      const signupForm = document.getElementById('form-signup');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');

      if (view === 'login') {
        // Form visibility
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        
        // Tab styling
        tabLogin.classList.add('bg-slate-800', 'shadow-sm', 'text-blue-500');
        tabLogin.classList.remove('text-slate-400');
        
        tabSignup.classList.remove('bg-slate-800', 'shadow-sm', 'text-blue-500');
        tabSignup.classList.add('text-slate-400');
      } else {
        // Form visibility
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        
        // Tab styling
        tabSignup.classList.add('bg-slate-800', 'shadow-sm', 'text-blue-500');
        tabSignup.classList.remove('text-slate-400');
        
        tabLogin.classList.remove('bg-slate-800', 'shadow-sm', 'text-blue-500');
        tabLogin.classList.add('text-slate-400');
      }
    }

    // Handle Login
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          alert('Login failed: ' + data.error);
        }
      } catch (error) {
        console.error('Error during login:', error);
        alert('Server error. Please test the backend connection.');
      }
    });

    // Handle Registration
    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const firstName = document.getElementById('signup-first').value;
      const lastName = document.getElementById('signup-last').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const terms = document.getElementById('terms').checked;

      if (!terms) {
        alert('You must agree to the Terms of Service.');
        return;
      }
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          alert('Registration successful! Please login.');
          toggleAuth('login');
          // Optionally auto-fill email field or trigger login automatically here.
        } else {
          alert('Registration failed: ' + data.error);
        }
      } catch (error) {
        console.error('Error during registration:', error);
        alert('Server error. Please test the backend connection.');
      }
    });

  </script>
<!-- END: Interaction Logic -->
</body></html>
